<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فتوى شرعية | الشيخ أبي عمَّار ياسر العدني</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #d1d8e0 100%);
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            border: 1px solid white;
        }

        .badge {
            background: var(--accent-color);
            color: white;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            display: inline-block;
            margin-bottom: 15px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.3rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .speaker-box {
            margin-bottom: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 15px;
            border-right: 4px solid var(--accent-color);
        }

        .speaker-name { color: #555; font-weight: 500; display: block; }
        .speaker-title { color: var(--accent-color); font-size: 0.95rem; font-weight: bold; }

        /* تنسيق مشغل قوقل */
        .audio-wrapper {
            position: relative;
            width: 100%;
            height: 150px; /* ارتفاع مناسب للمشغل */
            overflow: hidden;
            border-radius: 15px;
            background: #000;
        }

        iframe {
            position: absolute;
            top: -50px; /* إزاحة لإخفاء شريط قوقل العلوي الزائد */
            left: 0;
            width: 100%;
            height: 250px;
            border: none;
        }

        .instructions {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="badge">إجابة صوتية</div>
    
    <h1>هل يضع المصلي في حال خروره إلى السجود يديه أم ركبتيه؟</h1>

    <div class="speaker-box">
        <span class="speaker-name">أجاب عنه فضيلة الشيخ الفقيه:</span>
        <span class="speaker-title">أبي عمَّار ياسر العدني - حفظه الله -</span>
    </div>

    <div class="audio-wrapper">
        <iframe src="https://drive.google.com/file/d/1WIR2h37nY3gpDYvwO7F-tfBMV9eT5OS2/preview"></iframe>
    </div>

    <p class="instructions">اضغط على زر التشغيل في الأعلى للاستماع</p>
</div>

</body>
</html>
