<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فتوى | أبي عمَّار ياسر العدني</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;       /* أزرق عصري */
            --primary-dark: #1e40af;
            --bg-color: #f3f4f6;      /* رمادي فاتح مريح */
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --progress-bg: #e5e7eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        /* البطاقة العصرية */
        .player-card {
            background: var(--card-bg);
            width: 90%;
            max-width: 420px;
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 
                        0 10px 10px -5px rgba(0, 0, 0, 0.01); /* ظل ناعم جداً */
            text-align: center;
            transition: transform 0.2s;
        }

        /* أيقونة */
        .icon-box {
            width: 60px;
            height: 60px;
            background: #eff6ff;
            color: var(--primary);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            margin: 0 auto 1.5rem;
        }

        h1 {
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .author {
            font-size: 0.9rem;
            color: var(--text-sub);
            font-weight: 500;
            display: block;
            margin-bottom: 2rem;
        }

        /* حاوية التحكم */
        .controls-area {
            margin-top: 1rem;
        }

        /* شريط التقدم المخصص */
        .progress-container {
            width: 100%;
            height: 6px;
            background: var(--progress-bg);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 10px;
            position: relative;
            transition: width 0.1s linear;
        }

        /* النقطة في نهاية الشريط */
        .progress-fill::after {
            content: '';
            position: absolute;
            left: 100%; /* في النهاية */
            top: 50%;
            transform: translate(-50%, -50%); /* توسيط */
            width: 14px;
            height: 14px;
            background: var(--primary);
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            opacity: 0; /* مخفي افتراضياً */
            transition: opacity 0.2s;
        }

        .progress-container:hover .progress-fill::after {
            opacity: 1; /* يظهر عند مرور الماوس */
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        /* الأزرار السفلية */
        .buttons-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        /* زر التشغيل الكبير */
        .btn-play {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
            transition: all 0.2s ease;
        }

        .btn-play:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }

        .btn-play:active { transform: scale(0.95); }

        /* زر السرعة */
        .btn-speed {
            background: none;
            border: 2px solid #e5e7eb;
            color: var(--text-main);
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            min-width: 50px;
        }

        .btn-speed:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* زر التحميل */
        .btn-download {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 1.2rem;
            transition: 0.2s;
        }
        .btn-download:hover { color: var(--text-main); }

        /* أيقونات SVG بسيطة داخل الأزرار */
        svg { width: 24px; height: 24px; fill: currentColor; }

    </style>
</head>
<body>

<div class="player-card">
    <div class="icon-box">
        <svg viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
    </div>

    <h1>هل يضع المصلي في حال خروره إلى السجود يديه أم ركبتيه؟</h1>
    <span class="author">فضيلة الشيخ أبي عمَّار ياسر العدني</span>

    <div class="controls-area">
        <div class="progress-container" id="progressContainer">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div class="time-labels">
            <span id="currentTime">0:00</span>
            <span id="duration">--:--</span>
        </div>

        <div class="buttons-row">
            <button class="btn-speed" id="speedBtn" title="سرعة التشغيل">1x</button>

            <button class="btn-play" id="playBtn">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>

            <a href="https://www.dropbox.com/scl/fi/neonlvbd1x8t5f5f5m81y/_-_-_-_-_-_-_.mp3?rlkey=1lg9tckdzroppth8m7zesqx9p&st=wigl8owl&dl=1" class="btn-download" title="تحميل">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            </a>
        </div>
    </div>
</div>

<audio id="audio" src="https://www.dropbox.com/scl/fi/neonlvbd1x8t5f5f5m81y/_-_-_-_-_-_-_.mp3?rlkey=1lg9tckdzroppth8m7zesqx9p&st=wigl8owl&raw=1"></audio>

<script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const speedBtn = document.getElementById('speedBtn');

    // تشغيل / إيقاف
    playBtn.addEventListener('click', () => {
        if (audio.paused) {
            audio.play();
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
        } else {
            audio.pause();
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
        }
    });

    // تحديث شريط التقدم
    audio.addEventListener('timeupdate', () => {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${percent}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    // جلب مدة المقطع عند التحميل
    audio.addEventListener('loadedmetadata', () => {
        durationEl.textContent = formatTime(audio.duration);
    });

    // النقر على شريط التقدم للتقديم/التأخير
    progressContainer.addEventListener('click', (e) => {
        const width = progressContainer.clientWidth;
        const clickX = e.offsetX;
        const duration = audio.duration;
        audio.currentTime = (clickX / width) * duration;
    });

    // تغيير السرعة (ميزة عصرية)
    speedBtn.addEventListener('click', () => {
        let currentSpeed = audio.playbackRate;
        if (currentSpeed === 1) {
            audio.playbackRate = 1.5;
            speedBtn.textContent = '1.5x';
        } else if (currentSpeed === 1.5) {
            audio.playbackRate = 2;
            speedBtn.textContent = '2x';
        } else {
            audio.playbackRate = 1;
            speedBtn.textContent = '1x';
        }
    });

    // عند انتهاء الصوت
    audio.addEventListener('ended', () => {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        progressFill.style.width = '0%';
    });

    // تنسيق الوقت (دقائق:ثواني)
    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
    }
</script>

</body>
</html>
