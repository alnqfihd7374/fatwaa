<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فتوى الشيخ أبي عمَّار ياسر العدني</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3799;
            --bg: #f4f7f6;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #eee;
        }

        h2 { color: #2d3436; font-size: 1.2rem; margin-bottom: 20px; line-height: 1.6; }
        
        .author-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .author-info span { display: block; color: var(--primary); font-weight: bold; }

        /* مشغل صوتي بسيط وأنيق */
        .audio-wrapper {
            background: #edf2f7;
            padding: 15px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        audio {
            width: 100%;
            height: 35px;
        }

        .btn-download {
            margin-top: 20px;
            display: block;
            text-decoration: none;
            color: #777;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .btn-download:hover { color: var(--primary); }
    </style>
</head>
<body>

<div class="card">
    <h2>هل يضع المصلي في حال خروره إلى السجود يديه أم ركبتيه؟</h2>
    
    <div class="author-info">
        <small>أجاب عنه فضيلة الشيخ:</small>
        <span>أبي عمَّار ياسر العدني</span>
    </div>

    <div class="audio-wrapper">
        <audio controls preload="none">
            <source src="https://docs.google.com/uc?export=download&id=1WIR2h37nY3gpDYvwO7F-tfBMV9eT5OS2" type="audio/mpeg">
            متصفحك لا يدعم تشغيل الصوت.
        </audio>
    </div>

    <a href="https://drive.google.com/file/d/1WIR2h37nY3gpDYvwO7F-tfBMV9eT5OS2/view" target="_blank" class="btn-download">
        فتح في قوقل درايف (إذا لم يشتغل المشغل)
    </a>
</div>

</body>
</html>
